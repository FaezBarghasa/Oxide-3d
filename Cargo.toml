[workspace]
resolver = "2"
members = [
    "apps/*",
    "crates/*",
    "plugins/sdk",
    "tools/xtask",
]
exclude = [
    "plugins/examples",
    "tools/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://example.com/oxide-3d"
authors = ["Oxide-3D Contributors"]

[workspace.dependencies]
# ------------------------------------------------------------
# Internal Crates
# ------------------------------------------------------------
oxide-core = { path = "crates/oxide-core" }
oxide-math = { path = "crates/oxide-math" }
oxide-geo = { path = "crates/oxide-geo" }
oxide-geo-ops = { path = "crates/oxide-geo-ops" }
oxide-geo-io = { path = "crates/oxide-geo-io" }
oxide-feature = { path = "crates/oxide-feature" }
oxide-nodes = { path = "crates/oxide-nodes" }
oxide-scene = { path = "crates/oxide-scene" }
oxide-render = { path = "crates/oxide-render" }
oxide-ui = { path = "crates/oxide-ui" }
oxide-ui-widgets = { path = "crates/oxide-ui-widgets" }
oxide-sim-core = { path = "crates/oxide-sim-core" }
oxide-sim-fea = { path = "crates/oxide-sim-fea" }
oxide-sim-cfd = { path = "crates/oxide-sim-cfd" }
oxide-sim-topopt = { path = "crates/oxide-sim-topopt" }
oxide-mech = { path = "crates/oxide-mech" }
oxide-cam = { path = "crates/oxide-cam" }
oxide-metrology = { path = "crates/oxide-metrology" }
oxide-plm = { path = "crates/oxide-plm" }
oxide-settings = { path = "crates/oxide-settings" }
oxide-persist = { path = "crates/oxide-persist" }
oxide-collab = { path = "crates/oxide-collab" }
oxide-automation = { path = "crates/oxide-automation" }
oxide-script-python = { path = "crates/oxide-script-python" }
oxide-script-rhai = { path = "crates/oxide-script-rhai" }
oxide-plugins-wasm = { path = "crates/oxide-plugins-wasm" }
oxide-compute = { path = "crates/oxide-compute" }
oxide-compute-runtime = { path = "crates/oxide-compute-runtime" }
oxide-hal = { path = "crates/oxide-hal" }
oxide-backend-cpu = { path = "crates/oxide-backend-cpu" }
oxide-backend-wgpu = { path = "crates/oxide-backend-wgpu" }
oxide-backend-cuda = { path = "crates/oxide-backend-cuda" }
oxide-backend-rocm = { path = "crates/oxide-backend-rocm" }
oxide-backend-vulkan = { path = "crates/oxide-backend-vulkan" }
oxide-backend-metal = { path = "crates/oxide-backend-metal" }
oxide-backend-dx12 = { path = "crates/oxide-backend-dx12" }
oxide-backend-opencl = { path = "crates/oxide-backend-opencl" }
oxide-kernels = { path = "crates/oxide-kernels" }
oxide-ffi-safe = { path = "crates/oxide-ffi-safe" }
oxide-telemetry = { path = "crates/oxide-telemetry" }
oxide-test-utils = { path = "crates/oxide-test-utils" }

# ------------------------------------------------------------
# Error handling / diagnostics
# ------------------------------------------------------------
thiserror = "2.0"
anyhow = "1.0"
miette = { version = "7.4", features = ["fancy"] }

# ------------------------------------------------------------
# Serialization / data formats
# ------------------------------------------------------------
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
rmp-serde = "1.3"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
ciborium = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zstd = "0.13"
memmap2 = "0.9"

# ------------------------------------------------------------
# Identifiers / time / text
# ------------------------------------------------------------
uuid = { version = "1.12", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
regex = "1.11"
itertools = "0.14"
unic-langid = "0.9"
fluent = "0.16"
intl-memoizer = "0.5"

# ------------------------------------------------------------
# Containers / parallelism
# ------------------------------------------------------------
smallvec = { version = "1.13", features = ["serde"] }
arrayvec = { version = "0.7", features = ["serde"] }
indexmap = { version = "2.7", features = ["serde"] }
dashmap = "6.1"
parking_lot = "0.12"
crossbeam = "0.8"
rayon = "1.10"
flume = "0.11"
async-channel = "2.3"
futures = "0.3"
bumpalo = { version = "3.17", features = ["collections"] }
slotmap = { version = "1.0", features = ["serde"] }
petgraph = { version = "0.7", features = ["serde-1"] }

# ------------------------------------------------------------
# Async runtime
# ------------------------------------------------------------
tokio = { version = "1.43", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["rt", "io", "codec"] }

# ------------------------------------------------------------
# Math / precision / geometry
# ------------------------------------------------------------
nalgebra = { version = "0.33", features = ["serde-serialize"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
faer = "0.21"
approx = "0.5"
num-traits = "0.2"
num-rational = "0.4"
num-bigint = "0.4"
uom = { version = "0.36", features = ["serde"] }
robust = "1.1"
spade = "2.13"
rstar = "0.12"
ndarray = "0.16"
bitflags = { version = "2.8", features = ["serde"] }
bytemuck = { version = "1.21", features = ["derive"] }

# ------------------------------------------------------------
# GPU / rendering
# ------------------------------------------------------------
wgpu = "24.0"
naga = "24.0"
encase = { version = "0.10", features = ["glam"] }
pollster = "0.4"
half = { version = "2.4", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "exr",
] }
palette = "0.7"

# ------------------------------------------------------------
# UI
# ------------------------------------------------------------
iced = { version = "0.13", features = [
    "tokio",
    "wgpu",
    "advanced",
    "image",
    "svg",
    "lazy",
    "canvas",
] }
rfd = "0.15"
arboard = "3.4"
ashpd = "0.10"
directories = "6.0"
keyring = "3.6"
notify = "8.0"
human-panic = "2.0"
sysinfo = "0.33"
nucleo = "0.5"

# ------------------------------------------------------------
# Observability
# ------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-chrome = "0.7"
console-subscriber = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# ------------------------------------------------------------
# Persistence / collaboration
# ------------------------------------------------------------
redb = "2.4"
git2 = "0.20"
automerge = "0.6"
object_store = "0.11"

# ------------------------------------------------------------
# CLI / server / networking
# ------------------------------------------------------------
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
dialoguer = "0.11"
indicatif = "0.17"
comfy-table = "7.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "compression-zstd",
] }
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
rustls = "0.23"
webpki-roots = "0.26"

# ------------------------------------------------------------
# Scripting / plugins
# ------------------------------------------------------------
pyo3 = { version = "0.23", features = [
    "abi3",
    "auto-initialize",
    "serde",
] }
rhai = { version = "1.20", features = ["sync", "serde"] }
wasmtime = "29.0"
wasmtime-wasi = "29.0"
wit-bindgen = "0.38"

# ------------------------------------------------------------
# Physics / mechanics
# ------------------------------------------------------------
rapier3d = { version = "0.22", features = [
    "parallel",
    "simd-stable",
    "serde-serialize",
] }
parry3d = { version = "0.17", features = [
    "simd-stable",
    "serde-serialize",
] }

# ------------------------------------------------------------
# Industrial data / analytics
# ------------------------------------------------------------
polars = { version = "0.46", features = [
    "lazy",
    "parquet",
    "ipc",
    "serde",
] }

# ------------------------------------------------------------
# Testing / benchmarking
# ------------------------------------------------------------
proptest = "1.6"
proptest-derive = "0.5"
criterion = "0.5"
insta = { version = "1.42", features = ["json", "redactions"] }
rstest = "0.24"
pretty_assertions = "1.4"
mockall = "0.13"
tokio-test = "0.4"
test-log = "0.2"
trybuild = "1.0"
libfuzzer-sys = "0.4"

# ------------------------------------------------------------
# Workspace linting
# ------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
rust_2024_compatibility = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"

# ------------------------------------------------------------
# Build profiles
# ------------------------------------------------------------
[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package.oxide-render]
opt-level = 3

[profile.release.package.oxide-sim-fea]
opt-level = 3

[profile.release.package.oxide-sim-cfd]
opt-level = 3

[profile.release.package.oxide-geo-ops]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
